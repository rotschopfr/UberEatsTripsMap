name: Archaeology chainsaw_rose handle

on:
  pull_request:
    branches: [main]
    paths:
      - HANDLE_MINE.txt

permissions:
  contents: read

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public archive indexes
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json, time
          queries = [
            ('twitter statuses','https://web.archive.org/cdx/search/cdx?url=twitter.com/chainsaw_rose/status/*&from=2021&to=2025&output=json&filter=statuscode:200&collapse=urlkey'),
            ('twitter profile','https://web.archive.org/cdx/search/cdx?url=twitter.com/chainsaw_rose&from=2021&to=2025&output=json&filter=statuscode:200&collapse=digest'),
            ('x statuses','https://web.archive.org/cdx/search/cdx?url=x.com/chainsaw_rose/status/*&from=2023&to=2025&output=json&filter=statuscode:200&collapse=urlkey'),
            ('x profile','https://web.archive.org/cdx/search/cdx?url=x.com/chainsaw_rose&from=2023&to=2025&output=json&filter=statuscode:200&collapse=digest'),
            ('instagram profile','https://web.archive.org/cdx/search/cdx?url=instagram.com/chainsaw_rose&from=2023&to=2025&output=json&filter=statuscode:200&collapse=digest'),
            ('instagram children','https://web.archive.org/cdx/search/cdx?url=instagram.com/chainsaw_rose/*&from=2023&to=2025&output=json&filter=statuscode:200&collapse=urlkey'),
            ('tiktok','https://web.archive.org/cdx/search/cdx?url=tiktok.com/@chainsaw_rose/*&from=2021&to=2025&output=json&filter=statuscode:200&collapse=urlkey'),
          ]
          headers={'User-Agent':'Mozilla/5.0 research'}
          out=[]
          for label,url in queries:
              out.append('\n===== '+label+' =====\n'+url)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r:
                      data=r.read().decode('utf-8','replace')
                  out.append(data[:100000])
              except Exception as e:
                  out.append('ERROR '+repr(e))
              time.sleep(2)
          open('handle-cdx.txt','w').write('\n'.join(out))
          print('\n'.join(out))
          PY

      - name: Search CDX for TimothyDutch co-occurrence targets
        run: |
          python - <<'PY'
          import urllib.request, time
          urls = [
            'https://web.archive.org/cdx/search/cdx?url=twitter.com/TimothyDutch/*&from=2021&to=2024&output=json&filter=urlkey:chainsaw_rose&collapse=urlkey',
            'https://web.archive.org/cdx/search/cdx?url=twitter.com/chainsaw_rose/*&from=2021&to=2024&output=json&filter=urlkey:TimothyDutch&collapse=urlkey'
          ]
          with open('timothy-cdx.txt','w') as f:
            for u in urls:
              f.write('\n'+u+'\n')
              try:
                req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 research'})
                data=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
              except Exception as e: data='ERROR '+repr(e)
              f.write(data+'\n'); print(u); print(data)
              time.sleep(2)
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: chainsaw-rose-handle-archaeology
          path: |
            handle-cdx.txt
            timothy-cdx.txt
          retention-days: 7
